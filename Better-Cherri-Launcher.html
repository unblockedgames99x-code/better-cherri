<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Better Cherri</title>
<style>html,body{margin:0;min-height:100%;background:#0d090c;color:#fff;font:15px/1.5 Inter,system-ui,sans-serif}body{min-height:100vh;display:grid;place-items:center}.card{box-sizing:border-box;width:min(440px,calc(100% - 32px));padding:32px;border:1px solid #ffc8d238;border-radius:24px;background:#171116}h1{margin:0 0 10px;font-size:30px;letter-spacing:-1px}p{color:#c7aeb7;margin:0 0 24px}button{width:100%;border:0;border-radius:12px;padding:13px 18px;font:600 15px Inter,system-ui,sans-serif;background:#f17496;color:#170911;cursor:pointer}button:focus-visible{outline:3px solid #fff;outline-offset:4px}#status{margin:16px 0 0;font-size:13px;min-height:20px;overflow-wrap:anywhere}#status.error{color:#ffadb9}</style></head>
<body><main class="card"><h1>Better Cherri</h1><p>Games, music, and private chat with saved messages.</p><button id="launch" type="button">Launch Better Cherri</button><p id="status" role="status" aria-live="polite"></p></main>
<script>(()=>{'use strict';const cdn="https://cdn.jsdelivr.net/gh/unblockedgames99x-code/better-cherri@main/app.js",community=null;const status=document.getElementById('status');document.getElementById('launch').addEventListener('click',()=>{let child;try{child=window.open('about:blank','_blank');if(!child){status.className='error';status.textContent='Your browser blocked the new tab. Allow pop-ups for this launcher, then click Launch Better Cherri again.';return;}child.opener=null;if(community)child.__BETTER_MATRIX_COMMUNITY__=community;child.document.open();child.document.write('<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Better Cherri</title></head><body style="background:#0d090c;color:#fff;font:15px system-ui;padding:32px"><p id="better-launch-status" role="status">Loading Better Cherri…</p></body></html>');child.document.close();const script=child.document.createElement('script');script.src=cdn;script.async=true;script.onerror=()=>{status.className='error';status.textContent='Better Cherri could not load from jsDelivr. Check your connection and try again.';try{const note=child.document.getElementById('better-launch-status');if(note)note.textContent=status.textContent;}catch{}};script.onload=()=>{status.className='';status.textContent='Better Cherri opened in the new tab.';};child.document.body.appendChild(script);status.className='';status.textContent='Loading Better Cherri in the new tab…';}catch(error){status.className='error';status.textContent='The launcher could not open Better Cherri. Allow pop-ups and try again.';}});})();</script></body></html>
